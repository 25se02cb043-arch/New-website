<!DOCTYPE html>
<html>
<head>
    <title>My Simple Website</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: lightblue;
            padding: 50px;
        }

        .box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Welcome to My Website</h1>

        <h2>Nikunj Vekariy</h2>

        <p>CSE - Cyber Security</p>

        <p>Welcome to my new website.</p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Hello! Welcome to my website.";
        }
    </script>

</body>
</html>
